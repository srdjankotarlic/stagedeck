name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the standalone Windows Elgato plugin
        shell: powershell
        run: ./scripts/build-plugin-windows.ps1
      - run: npm run assets
      - run: npm run plugin
      - run: npm test
      - name: Windows PowerShell and Win32 bridge
        shell: powershell
        run: |
          ./scripts/validate-windows.ps1
          ./scripts/check-powerpoint-lifecycle.ps1
      - name: Actual Windows window capture without Office
        run: node scripts/check-windows-capture.cjs
      - name: Real Win32 routing and Office retry filter
        shell: powershell
        run: ./scripts/check-windows-routing.ps1
      - name: PDF playback, themes, labels and Stream Deck protocol on Windows
        run: |
          node scripts/create-fixtures.cjs
          npm run test:ui
      - run: npm run build:win
      - name: Install the Windows package and verify the installed application
        shell: powershell
        run: |
          $installer = (Get-ChildItem release/StageDeck-*-Windows-Setup.exe).FullName
          $process = Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\StageDeck-Test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($file in @('StageDeck.exe', 'resources\installers\com.stagedeck.presentations.streamDeckPlugin', 'resources\installers\StageDeck XL.streamDeckProfile', 'resources\validation\Proveri Windows.cmd')) {
            if (-not (Test-Path (Join-Path 'C:\StageDeck-Test' $file))) { throw "Missing installed file: $file" }
          }
          $env:STAGEDECK_TEST_EXE = 'C:\StageDeck-Test\StageDeck.exe'
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package the complete Windows download
        run: python scripts/package-downloads.py --windows (Get-ChildItem release/StageDeck-*-Windows-Setup.exe).FullName --windows-plugin release/win-unpacked/resources/installers --destination release/bundles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StageDeck-Windows-tested-build
          path: |
            release/bundles/StageDeck-Windows.zip
            release/bundles/SHA256SUMS.txt
            release/win-unpacked/resources/installers/*
            plugin/com.stagedeck.presentations.sdPlugin/windows/StageDeckPlugin.exe
          if-no-files-found: error
